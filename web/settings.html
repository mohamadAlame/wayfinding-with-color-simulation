<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Settings</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap">
<nav><a href="/">New participant</a><a href="/results">Results</a></nav><h1>Settings</h1>
<p>In Google Maps, stand where the walk starts in Street View, facing the right way. Copy the address from the address bar, or use ⋮ → Share or embed image → Embed a map and paste the code. Short maps.app.goo.gl links don't work.</p>
<form id="f"><h2>Practice</h2>
<label class="f">Street View start<textarea id="pv" rows="3"></textarea></label><iframe class="preview" id="pvf" title="Practice preview"></iframe><p class="error small" id="pve"></p>
<label class="f">Practice instruction<small>Same for everyone. Keep colours out of it.</small><textarea id="pd" rows="2"></textarea></label>
<h2>Test</h2><label class="f">Street View start<textarea id="tv" rows="3"></textarea></label><iframe class="preview" id="tvf" title="Test preview"></iframe><p class="error small" id="tve"></p>
<label class="f">Directions, mode A<small>Directions only</small><textarea id="da" rows="4"></textarea></label>
<label class="f">Directions, mode B<small>With the banner as a landmark. Best if only the part about the building changes.</small><textarea id="db" rows="4"></textarea></label>
<label class="f">Flag walks longer than (minutes)<small>Only marks them in the results; nobody is cut off.</small><input type="number" id="lim" min="1" max="60"></label>
<button>Save settings</button> <span id="msg" role="status"></span></form></main>
<script src="/common.js"></script><script>
let cfg;
function prev(k){const t=$(k).value,u=toEmbed(t);if(u)$(k+"f").src=u;$(k+"f").hidden=!u;$(k+"e").textContent=t&&!u?"This link can't be embedded. Use the address bar while in Street View, or the embed code.":"";}
for(const k of["pv","tv"])$(k).onchange=()=>prev(k);
api("/api/config").then(c=>{cfg=c;pv.value=c.practice.view;pd.value=c.practice.directions;tv.value=c.test.view;da.value=c.directions.plain;db.value=c.directions.banner;lim.value=c.limitMinutes;prev("pv");prev("tv");}).catch(e=>msg.textContent=e.message);
$("f").onsubmit=async e=>{e.preventDefault();if(!cfg)return;try{await api("/api/config",{...cfg,practice:{view:pv.value.trim(),directions:pd.value.trim()},test:{view:tv.value.trim()},directions:{plain:da.value.trim(),banner:db.value.trim()},limitMinutes:Number(lim.value)||5});msg.textContent="Saved.";}catch(x){msg.textContent="Not saved: "+x.message;}};
</script></body></html>
